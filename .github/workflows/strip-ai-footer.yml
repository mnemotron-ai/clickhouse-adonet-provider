name: strip-ai-footer

# Owner's rule (Mike, 08.11.2026): no AI attribution in PR bodies, comments or
# commits. The cloud GitHub integration appends a "Generated by Claude Code"
# footer on every write it makes; this workflow removes such lines as
# github-actions (GITHUB_TOKEN edits do not trigger workflows again, so no
# loop) and alerts when a commit with a trailer lands on main.
# Logic and selftest: scripts/ci/strip-ai-footer.py.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: strip-ai-footer-${{ github.event.pull_request.number || github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  strip:
    # issue_comment also fires on plain issues; bodies there are cleaned too.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default-branch script only (pull_request_target never runs PR code).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
      - name: Strip AI footer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push) python3 scripts/ci/strip-ai-footer.py --push ;;
            schedule|workflow_dispatch) python3 scripts/ci/strip-ai-footer.py --sweep ;;
            *) python3 scripts/ci/strip-ai-footer.py --event ;;
          esac
